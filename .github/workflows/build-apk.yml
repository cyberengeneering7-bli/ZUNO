name: Build APK

# Chalane ke 2 tareeke:
#  1) Code main branch pe push karo -> apne aap build
#  2) GitHub -> Actions -> "Build APK" -> "Run workflow" (manual)
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize migrated signing secrets
        env:
          RAW_ZUNO_KEYSTORE_BASE64: ${{ secrets.ZUNO_KEYSTORE_BASE64 }}
          RAW_ZUNO_KEYSTORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          RAW_ZUNO_KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          RAW_ZUNO_KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalize() {
            local name="$1"
            local value="$2"
            case "$value" in
              "$name="*) value="${value#"$name="}" ;;
            esac
            printf '%s' "$value" | tr -d '[:space:]'
          }
          keystore_base64=$(normalize ZUNO_KEYSTORE_BASE64 "$RAW_ZUNO_KEYSTORE_BASE64")
          keystore_password=$(normalize ZUNO_KEYSTORE_PASSWORD "$RAW_ZUNO_KEYSTORE_PASSWORD")
          key_alias=$(normalize ZUNO_KEY_ALIAS "$RAW_ZUNO_KEY_ALIAS")
          key_password=$(normalize ZUNO_KEY_PASSWORD "$RAW_ZUNO_KEY_PASSWORD")
          test -n "$keystore_base64"
          test -n "$keystore_password"
          test -n "$key_alias"
          test -n "$key_password"
          echo "::add-mask::$keystore_base64"
          echo "::add-mask::$keystore_password"
          echo "::add-mask::$key_alias"
          echo "::add-mask::$key_password"
          {
            printf 'ZUNO_KEYSTORE_BASE64=%s\n' "$keystore_base64"
            printf 'ZUNO_KEYSTORE_PASSWORD=%s\n' "$keystore_password"
            printf 'ZUNO_KEY_ALIAS=%s\n' "$key_alias"
            printf 'ZUNO_KEY_PASSWORD=%s\n' "$key_password"
          } >> "$GITHUB_ENV"

      - name: Decode permanent signing key
        run: |
          set -euo pipefail
          printf '%s' "$ZUNO_KEYSTORE_BASE64" | base64 --decode > app/zuno-release.jks
          test -s app/zuno-release.jks

      - name: Verify permanent signing key
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore app/zuno-release.jks \
            -storepass "$ZUNO_KEYSTORE_PASSWORD" \
            -alias "$ZUNO_KEY_ALIAS" \
            -keypass "$ZUNO_KEY_PASSWORD" \
            >/dev/null

      - name: Calculate build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((100 + GITHUB_RUN_NUMBER))
          version_name="1.${GITHUB_RUN_NUMBER}"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --console=plain assembleIzzyDebug -x lint --warning-mode summary
        env:
          # ---- YAHAN APNA NAAM / ID BADLO ----
          METROLIST_APPLICATION_ID: com.zuno.app
          METROLIST_APP_NAME: ZUNO
          # ------------------------------------
          METROLIST_DEBUG_KEYSTORE_PATH: zuno-release.jks
          METROLIST_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          METROLIST_DEBUG_KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          METROLIST_DEBUG_KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
          ZUNO_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ZUNO_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zuno-apk
          path: app/build/outputs/apk/izzy/debug/*.apk
          if-no-files-found: error

      - name: Print APK SHA-256 in job summary
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/izzy/debug -name '*.apk' -print -quit)
          test -n "$apk"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo '## ZUNO APK'
            echo "- File: \`$(basename "$apk")\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Version code: \`${{ steps.version.outputs.version_code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f app/zuno-release.jks
