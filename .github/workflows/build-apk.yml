name: Build APK

# Chalane ke 2 tareeke:
#  1) Code main branch pe push karo -> apne aap build
#  2) GitHub -> Actions -> "Build APK" -> "Run workflow" (manual)
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ek hi signing key har build mein use hogi, taaki naya APK
      # purane ke upar bina uninstall kiye update ho jaye.
      - name: Restore signing key cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: app/my-debug.keystore
          key: zuno-debug-keystore-v1

      - name: Create signing key (pehli baar)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/my-debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ZUNO,O=ZUNO,C=IN"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --console=plain assembleIzzyDebug -x lint --warning-mode summary
        env:
          # ---- YAHAN APNA NAAM / ID BADLO ----
          METROLIST_APPLICATION_ID: com.zuno.app
          METROLIST_APP_NAME: ZUNO
          # ------------------------------------
          METROLIST_DEBUG_KEYSTORE_PATH: my-debug.keystore
          METROLIST_DEBUG_KEYSTORE_PASSWORD: android
          METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
          METROLIST_DEBUG_KEY_PASSWORD: android
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zuno-apk
          path: app/build/outputs/apk/izzy/debug/*.apk
          if-no-files-found: error
