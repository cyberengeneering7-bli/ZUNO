name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((100 + GITHUB_RUN_NUMBER))
          version_name="1.${GITHUB_RUN_NUMBER}"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Decode and validate permanent signing key
        env:
          ZUNO_KEYSTORE_BASE64: ${{ secrets.ZUNO_KEYSTORE_BASE64 }}
          ZUNO_KEYSTORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          ZUNO_KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          ZUNO_KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ZUNO_KEYSTORE_BASE64"
          test -n "$ZUNO_KEYSTORE_PASSWORD"
          test -n "$ZUNO_KEY_ALIAS"
          test -n "$ZUNO_KEY_PASSWORD"
          printf '%s' "$ZUNO_KEYSTORE_BASE64" | base64 --decode > app/zuno-release.jks
          test -s app/zuno-release.jks
          keytool -list -keystore app/zuno-release.jks -storepass "$ZUNO_KEYSTORE_PASSWORD" -alias "$ZUNO_KEY_ALIAS" >/dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :innertube:test --warning-mode summary

      - name: Run lint
        run: ./gradlew --console=plain :app:lintFossRelease --warning-mode summary

      - name: Build signed updater-enabled FOSS release
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.zuno.app
          METROLIST_APP_NAME: ZUNO
          METROLIST_RELEASE_KEYSTORE_PATH: zuno-release.jks
          STORE_PASSWORD: ${{ secrets.ZUNO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZUNO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZUNO_KEY_PASSWORD }}
          ZUNO_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ZUNO_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/foss/release -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo '## ZUNO signed FOSS release APK'
            echo "- File: \`$(basename "$apk")\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Version code: \`${{ steps.version.outputs.version_code }}\`"
            echo '- Flavor: `fossRelease` (updater enabled, non-debug)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: zuno-foss-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f app/zuno-release.jks
