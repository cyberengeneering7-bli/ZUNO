name: Repair ZUNO signing secrets

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original signing key cache
        uses: actions/cache/restore@v4
        with:
          path: app/my-debug.keystore
          key: zuno-debug-keystore-v1

      - name: Verify original signing key
        run: |
          set -euo pipefail
          test -s app/my-debug.keystore
          keytool -list \
            -keystore app/my-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            >/dev/null

      - name: Upload one-time verified keystore
        uses: actions/upload-artifact@v4
        with:
          name: zuno-signing-keystore-recovery
          path: app/my-debug.keystore
          retention-days: 1

      - name: Remove restored key
        if: always()
        run: rm -f app/my-debug.keystore
