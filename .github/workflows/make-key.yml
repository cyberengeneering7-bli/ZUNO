name: Migrate ZUNO signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the existing signing key (never generate a replacement)
        id: key-cache
        uses: actions/cache/restore@v4
        with:
          path: app/my-debug.keystore
          key: zuno-debug-keystore-v1

      - name: Export existing key for manual secret storage
        run: |
          set -euo pipefail
          if [ ! -s app/my-debug.keystore ]; then
            echo "::error::The existing signing-key cache was not found. No new key was generated; stop and recover the old key before changing signers."
            exit 1
          fi
          keytool -list -keystore app/my-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          {
            echo "ZUNO_KEYSTORE_BASE64=$(base64 -w0 app/my-debug.keystore)"
            echo 'ZUNO_KEYSTORE_PASSWORD=android'
            echo 'ZUNO_KEY_ALIAS=androiddebugkey'
            echo 'ZUNO_KEY_PASSWORD=android'
          } > zuno-signing-secrets.txt
      - name: Upload one-time secret artifact
        uses: actions/upload-artifact@v4
        with:
          name: zuno-signing-secrets-one-time
          path: zuno-signing-secrets.txt
          retention-days: 1
      - name: Remove key and exported secrets
        if: always()
        run: rm -f app/my-debug.keystore zuno-signing-secrets.txt
